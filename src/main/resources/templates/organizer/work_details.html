<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/head :: head('Работа')}"></head>
<body>
<div class="app">
    <header th:replace="~{components/topbar :: bar(~{::nav}, null)}">
        <nav class="topbar__nav">
            <a th:href="@{/organizer}">Обзор</a>
            <a th:href="@{/organizer/cycles}">Кампании</a>
        </nav>
    </header>

    <aside th:replace="~{components/sidebar :: bar(${roleSidebar}, 'cycles', 'Otklik', ${roleSidebarSubtitle})}"></aside>

    <main class="app__main">
        <div class="page__hero">
            <div>
                <a th:href="@{/organizer/cycles/{id}/results(id=${work.campaign.id})}" class="muted small">← К результатам кампании</a>
                <h1 class="page__title mt-2" th:text="${work.title}">Работа</h1>
                <p class="page__subtitle">
                    <span th:text="${work.campaign.title}"></span> · Автор:
                    <a th:href="@{/profile/{id}(id=${work.student.id})}"
                       th:text="${work.student.fullName != null ? work.student.fullName : work.student.username}">Студент</a>
                    <span th:switch="${work.status.name()}" style="margin-left:8px;">
                        <span th:case="'UPLOADED'" class="badge badge--gray">Загружено</span>
                        <span th:case="'IN_QUEUE'" class="badge badge--gray">В очереди</span>
                        <span th:case="'UNDER_REVIEW'" class="badge badge--inprogress">В проверке</span>
                        <span th:case="'REVIEWED'" class="badge badge--done">Проверено</span>
                        <span th:case="'NEEDS_REVISION'" class="badge badge--wait">Нужны правки</span>
                    </span>
                </p>
            </div>
        </div>

        <div class="grid grid--main">
            <div class="stack">
                <div class="card" th:if="${work.contentText != null and !#strings.isEmpty(work.contentText)}">
                    <div class="card__label mb-2">Описание</div>
                    <div th:text="${work.contentText}" style="white-space:pre-wrap;"></div>
                </div>

                <div class="card" th:if="${work.externalLink != null}">
                    <div class="card__label mb-2">Ссылка</div>
                    <a th:href="${work.externalLink}" target="_blank" th:text="${work.externalLink}"></a>
                </div>

                <div class="card" th:if="${not #lists.isEmpty(attachments)}">
                    <div class="card__label mb-3" th:text="'Файлы (' + ${#lists.size(attachments)} + ')'">Файлы</div>
                    <div class="stack" style="gap:6px;">
                        <div th:each="att : ${attachments}" class="row gap-3">
                            <a th:if="${not att.voice}" th:href="@{/files/work/{id}(id=${att.id})}" target="_blank" th:text="${att.originalFilename}"></a>
                            <span th:if="${att.voice}" class="muted">🎤 Голосовое: <audio controls th:src="@{/files/work/{id}(id=${att.id})}" style="vertical-align:middle;height:32px;"></audio></span>
                        </div>
                    </div>
                </div>

                <div th:each="row : ${reviewRows}" class="card" th:with="a=${row.assignment},r=${row.review}">
                    <div class="row row--between mb-3">
                        <div>
                            <strong>Рецензент:</strong>
                            <a th:href="@{/profile/{id}(id=${a.reviewer.id})}"
                               th:text="${a.reviewer.fullName != null ? a.reviewer.fullName : a.reviewer.username}">user</a>
                            <span th:switch="${a.status.name()}" style="margin-left:8px;">
                                <span th:case="'IN_PROGRESS'" class="badge badge--inprogress">В работе</span>
                                <span th:case="'COMPLETED'" class="badge badge--done">Завершено</span>
                                <span th:case="'ABANDONED'" class="badge badge--gray">Отозвано</span>
                                <span th:case="*" class="badge badge--gray" th:text="${a.status}"></span>
                            </span>
                        </div>
                        <div class="muted small" th:if="${a.completedAt != null}" th:text="${#temporals.format(a.completedAt, 'dd.MM.yyyy HH:mm')}"></div>
                    </div>

                    <div th:if="${r != null and r.totalScore != null}" class="mb-3">
                        <span class="metric__value" style="font-size:22px;line-height:1;">
                            <span th:text="${r.totalScore}">0</span><span class="muted" style="font-size:13px;" th:text="' / ' + ${work.campaign.scaleMax}"></span>
                        </span>
                    </div>

                    <div th:if="${r != null and r.feedback != null and !#strings.isEmpty(r.feedback)}" class="small" style="white-space:pre-wrap;" th:text="${r.feedback}"></div>
                    <div th:if="${r == null}" class="muted small">Рецензия ещё не создана.</div>
                </div>
            </div>

            <div class="stack">
                <div class="card">
                    <div class="card__label mb-2">Кампания</div>
                    <div th:text="${work.campaign.title}"></div>
                    <div class="muted small mt-2" th:text="'Режим: ' + ${work.campaign.mode}"></div>
                    <div class="muted small" th:text="'Анонимность: ' + ${work.campaign.anonymityMode}"></div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{components/footer :: bar}"></footer>
</div>
</body>
</html>
