<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/head :: head('Кампания')}"></head>
<body>
<div class="app">
    <header th:replace="~{components/topbar :: bar(~{::nav}, null)}">
        <nav class="topbar__nav">
            <a th:href="@{/organizer}">Обзор</a>
            <a th:href="@{/organizer/cycles}" class="is-active">Кампании</a>
            <a th:href="@{/organizer/users}">Пользователи</a>
        </nav>
    </header>

    <aside th:replace="~{components/sidebar :: bar(${roleSidebar}, 'cycles', 'Otklik', ${roleSidebarSubtitle})}"></aside>

    <main class="app__main">
        <div class="page__hero">
            <div>
                <a th:href="@{/organizer/cycles}" class="muted small">← Все кампании</a>
                <h1 class="page__title mt-2" th:text="${campaign.title}">Кампания</h1>
                <p class="page__subtitle" th:text="${campaign.description}"></p>
            </div>
            <div class="row gap-2">
                <span th:if="${campaign.status.name() == 'DRAFT'}" class="badge badge--gray">Черновик</span>
                <span th:if="${campaign.status.name() == 'ACTIVE'}" class="badge badge--inprogress">Активна</span>
                <span th:if="${campaign.status.name() == 'COMPLETED'}" class="badge badge--done">Завершена</span>
                <form th:if="${campaign.status.name() == 'DRAFT'}" th:action="@{/organizer/cycles/{id}/start(id=${campaign.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn--primary">Запустить</button>
                </form>
                <form th:if="${campaign.status.name() == 'ACTIVE'}" th:action="@{/organizer/cycles/{id}/complete(id=${campaign.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn--ghost">Завершить</button>
                </form>
                <a th:if="${campaign.status.name() != 'DRAFT'}" th:href="@{/organizer/cycles/{id}/results(id=${campaign.id})}" class="btn btn--dark">Результаты →</a>
            </div>
        </div>

        <div class="grid grid--2 mb-4">
            <div class="card">
                <div class="card__title mb-3">Параметры цикла</div>
                <table class="table" style="font-size:13px;">
                    <tbody>
                    <tr><td class="muted">Режим</td><td><strong th:text="${campaign.mode}"></strong></td></tr>
                    <tr><td class="muted">Анонимность</td><td><strong th:text="${campaign.anonymityMode}"></strong></td></tr>
                    <tr><td class="muted">Шкала</td><td><strong th:text="'0..' + ${campaign.scaleMax}"></strong></td></tr>
                    <tr><td class="muted">Длительность</td><td><strong th:text="${campaign.expectedDurationDays != null ? campaign.expectedDurationDays + ' дней' : '—'}"></strong></td></tr>
                    <tr><td class="muted">Дедлайн</td><td><strong th:text="${campaign.deadline != null ? #temporals.format(campaign.deadline, 'dd.MM.yyyy HH:mm') : '—'}"></strong></td></tr>
                    </tbody>
                </table>
            </div>

            <div class="card">
                <div class="card__title mb-3">Критерии</div>
                <table class="table" style="font-size:13px;">
                    <thead><tr><th>Название</th><th>Вес</th></tr></thead>
                    <tbody>
                    <tr th:each="crit : ${criteria}">
                        <td>
                            <strong th:text="${crit.name}"></strong>
                            <div class="muted small" th:text="${crit.description}"></div>
                        </td>
                        <td><strong th:text="${crit.weight} + '%'"></strong></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(criteria)}"><td colspan="2" class="muted">Критериев нет.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card__head">
                <div class="card__title">Работы в этой кампании</div>
                <span class="muted small" th:text="${#lists.size(works)} + ' работ'"></span>
            </div>
            <table class="table">
                <thead><tr><th>Название</th><th>Студент</th><th>Статус</th><th>Добавлено</th></tr></thead>
                <tbody>
                <tr th:each="w : ${works}">
                    <td><strong th:text="${w.title}"></strong></td>
                    <td class="muted small" th:text="${w.student.username}"></td>
                    <td><span class="tag" th:text="${w.status}"></span></td>
                    <td class="muted small" th:text="${#temporals.format(w.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(works)}"><td colspan="4" class="muted" style="text-align:center;padding:24px;">Работ пока нет.</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer th:replace="~{components/footer :: bar}"></footer>
</div>
</body>
</html>
