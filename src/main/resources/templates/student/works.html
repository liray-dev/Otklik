<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/head :: head('Мои работы')}"></head>
<body>
<div class="app">
    <header th:replace="~{components/topbar :: bar(~{::nav}, null)}">
        <nav class="topbar__nav">
            <a th:href="@{/student/works}" class="is-active">Мои работы</a>
            <a th:href="@{/student/cycles}">Доступные кампании</a>
        </nav>
    </header>

    <aside th:replace="~{components/sidebar :: bar(${roleSidebar}, 'works', 'Otklik', ${roleSidebarSubtitle})}"></aside>

    <main class="app__main">
        <div th:if="${param.submitted}" class="alert alert--ok">Работа отправлена.</div>

        <div class="page__hero">
            <div>
                <h1 class="page__title">Мои работы</h1>
                <p class="page__subtitle">Статус проверок и полученные рецензии.</p>
            </div>
        </div>

        <div class="stack">
            <div th:each="row : ${rows}" class="card" th:with="w=${row.work}">
                <div class="card__head">
                    <div>
                        <div class="card__title" th:text="${w.title}">Название</div>
                        <div class="muted small" th:text="'Кампания: ' + ${w.campaign.title}"></div>
                    </div>
                    <div class="row gap-2">
                        <span th:if="${w.status.name() == 'UPLOADED'}" class="badge badge--gray">Загружено</span>
                        <span th:if="${w.status.name() == 'IN_QUEUE'}" class="badge badge--gray">В очереди</span>
                        <span th:if="${w.status.name() == 'UNDER_REVIEW'}" class="badge badge--inprogress">В процессе</span>
                        <span th:if="${w.status.name() == 'REVIEWED'}" class="badge badge--done">Проверено</span>
                        <span th:if="${w.status.name() == 'NEEDS_REVISION'}" class="badge badge--wait">Нужны правки</span>
                        <a th:href="@{/student/cycles/{cid}/submit(cid=${w.campaign.id})}" class="btn btn--ghost btn--sm">Открыть →</a>
                    </div>
                </div>

                <div class="muted small" th:if="${not #lists.isEmpty(row.attachments)}">
                    Файлы:
                    <span th:each="att, iter : ${row.attachments}" th:if="${not att.voice}">
                        <a th:href="@{/files/work/{id}(id=${att.id})}" target="_blank" th:text="${att.originalFilename}"></a><span th:if="${not iter.last}">, </span>
                    </span>
                </div>
                <div class="muted small mt-2" th:if="${w.externalLink != null}">
                    Ссылка: <a th:href="${w.externalLink}" target="_blank" th:text="${w.externalLink}"></a>
                </div>

                <div class="mt-3">
                    <strong class="small" th:text="'Рецензий: ' + ${row.reviewsDone} + ' / ' + ${row.assignmentsTotal}"></strong>
                    <div th:each="rr : ${row.reviews}" class="mt-3" th:with="r=${rr.review},a=${rr.assignment},scores=${rr.scores}"
                         style="padding:14px;border:1px solid var(--border-soft);border-radius:8px;background:var(--paper);">
                        <div class="row row--between mb-3" th:with="anon=${w.campaign.anonymityMode.name()}">
                            <span>
                                <a th:if="${anon == 'OPEN'}" th:href="@{/profile/{id}(id=${a.reviewer.id})}"><strong th:text="${a.reviewer.fullName != null ? a.reviewer.fullName : a.reviewer.username}">Рецензент</strong></a>
                                <strong th:if="${anon != 'OPEN'}" th:text="'Рецензент #' + ${#strings.substring(#strings.replace(a.reviewer.id.toString(), '-', ''), 0, 6).toUpperCase()}">Рецензент</strong>
                            </span>
                            <span th:if="${r.totalScore != null}" class="metric__value" style="font-size:22px;line-height:1;">
                                <span th:text="${r.totalScore}">0</span><span class="muted" style="font-size:13px;" th:text="' / ' + ${row.scaleMax}"></span>
                            </span>
                        </div>

                        <div th:if="${not #lists.isEmpty(row.criteria)}" class="stack mb-3">
                            <div th:each="crit : ${row.criteria}" class="slider-row" th:with="value=${scores[crit.id]}">
                                <span class="label small" th:text="${crit.name} + ' (вес ' + ${crit.weight} + '%)'">Критерий</span>
                                <span class="num small" th:text="${value != null ? value : '—'}">—</span>
                            </div>
                        </div>

                        <div th:if="${r.feedback != null and !#strings.isEmpty(r.feedback)}" class="small" th:text="${r.feedback}"></div>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(rows)}" class="card" style="text-align:center;padding:40px;">
                <div class="muted">Вы ещё не отправляли ни одной работы.</div>
                <a th:href="@{/student/cycles}" class="btn btn--primary mt-3">Отправить первую</a>
            </div>
        </div>
    </main>

    <footer th:replace="~{components/footer :: bar}"></footer>
</div>
</body>
</html>
