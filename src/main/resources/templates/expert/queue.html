<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/head :: head('Очередь проверок')}"></head>
<body>
<div class="app">
    <header th:replace="~{components/topbar :: bar(~{::nav}, null)}">
        <nav class="topbar__nav">
            <a th:href="@{/organizer}">Обзор</a>
            <a th:href="@{/organizer/cycles}">Кампании</a>
            <a th:href="@{/expert/queue}" class="is-active">Очередь</a>
        </nav>
    </header>

    <aside th:replace="~{components/sidebar :: bar(
        ${ { {'key':'overview','label':'Панель организатора','href':'/organizer','icon':'▦'},
              {'key':'queue','label':'Очередь проверок','href':'/expert/queue','icon':'▤'},
              {'key':'review','label':'Интерфейс оценки','href':'/expert/in-progress','icon':'✎'},
              {'key':'results','label':'Панель результатов','href':'/expert/completed','icon':'▣'} } },
        'queue',
        'Otklik',
        'СИСТЕМА ПРОВЕРКИ')}"></aside>

    <main class="app__main">
        <div th:if="${param.submitted}" class="alert alert--ok">Рецензия отправлена. Спасибо!</div>

        <div class="grid grid--3 mb-4">
            <div class="card metric-card metric-card--accent">
                <div class="metric">
                    <div>
                        <div class="card__label">Всего задач</div>
                        <div class="metric__value" th:text="${totalWorksAvailable + inProgressCount + completedCount}">0</div>
                        <div class="metric__delta" th:text="'+' + ${totalWorksAvailable} + ' доступно сейчас'">+12</div>
                    </div>
                    <div class="metric__icon">📋</div>
                </div>
            </div>
            <div class="card metric-card">
                <div class="metric">
                    <div>
                        <div class="card__label">В процессе</div>
                        <div class="metric__value" th:text="${inProgressCount}">0</div>
                        <div class="metric__delta is-muted">Активные у вас</div>
                    </div>
                    <div class="metric__icon">⏳</div>
                </div>
            </div>
            <div class="card metric-card">
                <div class="metric">
                    <div>
                        <div class="card__label">Завершено</div>
                        <div class="metric__value" th:text="${completedCount}">0</div>
                        <div class="metric__delta is-muted">Финальных рецензий</div>
                    </div>
                    <div class="metric__icon">✓</div>
                </div>
            </div>
        </div>

        <div class="stack">
            <div class="row row--between">
                <h2 style="font-size:20px;font-weight:600;">Доступные задачи</h2>
            </div>

            <div th:each="mw : ${availableWorks}" class="task-card">
                <div class="task-card__head">
                    <div class="task-card__left">
                        <div class="task-card__icon">📄</div>
                        <div>
                            <div class="row gap-2 mb-2">
                                <span class="badge badge--new">Новое</span>
                                <span class="task-card__id" th:text="'ID: #' + ${#strings.substring(#strings.replace(mw.id.toString(), '-', ''), 0, 6).toUpperCase()}">ID: #ABC123</span>
                            </div>
                            <div class="task-card__title" th:text="${mw.title}">Название работы</div>
                            <div class="task-card__meta">
                                <span th:text="'Загружено: ' + ${#temporals.format(mw.work.createdAt, 'dd MMM yyyy')}"></span>
                                <span th:text="'Кампания: ' + ${mw.campaignTitle}"></span>
                            </div>
                        </div>
                    </div>
                    <div class="task-card__right">
                        <form th:action="@{/expert/queue/{id}/take(id=${mw.id})}" method="post">
                            <button type="submit" class="btn btn--primary btn--sm">Взять в работу →</button>
                        </form>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(availableWorks)}" class="card" style="text-align:center;padding:32px;">
                <div class="muted">Доступных работ нет. Загляните позже.</div>
            </div>
        </div>
    </main>

    <footer th:replace="~{components/footer :: bar}"></footer>
</div>
</body>
</html>
