<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/head :: head('Регистрация')}"></head>
<body>
<div class="auth-wrap">
    <div class="auth-card fade-in">
        <div class="auth-card__brand">
            <div class="brand__mark">N</div>
            <div>
                <div style="font-weight:700;font-size:16px;">NormIliNet · Otklik</div>
                <div class="muted small">Активация инвайта</div>
            </div>
        </div>
        <div class="auth-card__title">Регистрация</div>
        <div class="auth-card__sub">Используйте инвайт-код, выданный организатором</div>

        <div th:if="${errorMessage}" class="alert alert--err" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" th:object="${registrationRequest}" method="post">
            <div class="field">
                <label class="field__label" for="inviteCode">Инвайт-код</label>
                <input id="inviteCode" th:field="*{inviteCode}" type="text" class="input" placeholder="код приглашения" required autofocus>
                <span class="field__error" th:if="${#fields.hasErrors('inviteCode')}" th:errors="*{inviteCode}"></span>
            </div>
            <div class="field">
                <label class="field__label" for="username">Имя пользователя</label>
                <input id="username" th:field="*{username}" type="text" class="input" required>
                <span class="field__error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </div>
            <div class="field">
                <label class="field__label" for="email">Email (опционально)</label>
                <input id="email" th:field="*{email}" type="email" class="input">
                <span class="field__error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="field">
                <label class="field__label" for="password">Пароль</label>
                <input id="password" th:field="*{password}" type="password" class="input" required>
                <span class="field__error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>
            <button type="submit" class="btn btn--primary btn--block btn--lg">Зарегистрироваться</button>
        </form>

        <div class="auth-card__foot">
            Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
        </div>
    </div>
</div>
</body>
</html>
